# Maximum question length in Unicode characters; integer from 1 to 8000.
max_question_length: 1000
model:
  # Optional initial API root; users can change it in the page. HTTPS or loopback HTTP only.
  base_url: ''
  # Optional initial provider model identifier; blank requires user input.
  name: ''
  # Total request deadline in seconds, including streaming; number in (0, 86400].
  timeout: 600
  # Extra Chat Completions fields. Provider-dependent; never put credentials here.
  # Example: {max_tokens: 16384}. Core model/messages/stream fields cannot be overridden.
  generation: {}
